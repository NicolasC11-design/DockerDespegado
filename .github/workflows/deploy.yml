name: Publicar Imagen en Docker Hub

on:
  push:
    branches: [ "main" ]

jobs:

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
      
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r ./backend/requirements.txt
          pip install pytest bandit
      - name: Escaneo de seguridad (bandit)
        run: bandit -r . -s B101 

      - name: Run pytest
        run: |
          export PYTHONPATH=$PYTHONPATH:./backend
          pytest 

  build-and-push:
    needs: test-and-security
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Iniciar sesion en Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir imagen
        uses: docker/build-push-action@v4
        with:
          context: . 
          push: false
          load: true
          no-cache: true
          tags:  jonicribe1101/mi-api:latest

      - name: Escanear contenedor con trivy
        uses: aquasecurity/trivy-action@master
        with: 
          image-ref: 'jonicribe1101/mi-api:latest' 
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Subir la imagen a Docker Hub
        run: docker push jonicribe1101/mi-api:latest 

      - name: Deplegar en servidor cloud
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/DockerDespegado
            docker compose pull app-backend